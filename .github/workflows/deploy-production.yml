name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for manual deploy
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare production Worker config
        run: |
          node <<'EOF'
          const fs = require('fs')
          const configPath = 'dist/kore_veridian/wrangler.json'
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'))
          delete config.configPath
          delete config.userConfigPath
          fs.writeFileSync(configPath, JSON.stringify(config))
          EOF

      - name: Deploy Worker & assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/kore_veridian/wrangler.json

      - name: Deployment summary
        run: |
          echo "## Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Site:** https://koreveridian.ca" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Worker:** https://kore-veridian.klinicx-dev.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
